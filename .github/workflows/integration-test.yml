name: Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
        ports:
          - 9200:9200
        env:
          "discovery.type": single-node
          "xpack.security.enabled": "false"
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Pin to exact version to prevent unexpected behavior changes.
        # Current version is v2.34.2 per recent verification.
        run: pip install requests==2.34.2

      - name: Wait for Elasticsearch
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:9200/_cluster/health && break
            sleep 2
          done

      - name: Run integration tests
        run: python scripts/integration_test.py
