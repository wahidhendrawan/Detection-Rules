name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'sigma/**'
      - 'elastic/**'
      - 'splunk/**'
      - 'microsoft-sentinel/**'
      - 'wazuh/**'
      - 'carbonblack/**'
      - 'scripts/**'
      - 'docs/**'
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml==6.0.2

      - name: Generate coverage + index + reports + badges
        run: |
          PYTHONPATH=scripts python3 -m detection_rules coverage
          PYTHONPATH=scripts python3 -m detection_rules index
          PYTHONPATH=scripts python3 -m detection_rules metrics
          PYTHONPATH=scripts python3 -m detection_rules gap
          PYTHONPATH=scripts python3 -m detection_rules cti
          PYTHONPATH=scripts python3 -m detection_rules atomic
          PYTHONPATH=scripts python3 -m detection_rules navigator
          PYTHONPATH=scripts python3 -m detection_rules badges

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r public/* site/
          cp coverage.json site/
          cp rules.index.json site/
          cp COVERAGE.md site/
          # Reports + Navigator layers
          mkdir -p site/docs site/navigator-layers
          cp -f docs/metrics.md docs/gap-analysis.md docs/threat-actors.md \
                docs/threat-actors.json docs/atomic-red-team.md \
                docs/atomic-red-team.json site/docs/ 2>/dev/null || true
          cp -f navigator-layers/*.json site/navigator-layers/ 2>/dev/null || true
          # Stats for the landing page
          python3 - <<'PY'
          import json, pathlib
          idx = json.loads(pathlib.Path("rules.index.json").read_text())
          cov = json.loads(pathlib.Path("coverage.json").read_text())
          stats = {
              "total_rules": idx["summary"]["total_rules"],
              "total_techniques": idx["summary"]["total_techniques"],
              "rules_per_platform": idx["summary"]["rules_per_platform"],
              "fully_covered": idx["summary"]["fully_covered"],
              "single_platform_only": idx["summary"]["single_platform_only"],
              "navigator_version": cov["versions"],
          }
          pathlib.Path("site/stats.json").write_text(json.dumps(stats, indent=2))
          PY

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
