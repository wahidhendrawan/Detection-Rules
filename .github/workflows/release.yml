name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.1.0)'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: write
  id-token: write

jobs:
  translate-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install sigma-cli + backends
        run: |
          pip install --upgrade pip
          # sigma-cli 3.x for modern backend compatibility
          # NOTE: pysigma-backend-qradar-aql still pinned to old pysigma 0.x,
          # not compatible with sigma-cli 3.x. Skipped from this release.
          pip install \
            "sigma-cli>=3.0,<4.0" \
            "pysigma-backend-elasticsearch>=1.1,<3.0" \
            "pysigma-backend-splunk>=1.1,<3.0" \
            "pysigma-backend-kusto>=1.0,<2.0" \
            "pysigma-backend-crowdstrike>=2.0,<4.0" \
            "pyyaml>=6.0.3"
          sigma list targets || true
          pip show sigma-cli | grep Version || true

      - name: Generate coverage + index + metrics + gap + cti + atomic + navigator + badges
        run: |
          PYTHONPATH=scripts python3 -m detection_rules coverage
          PYTHONPATH=scripts python3 -m detection_rules index
          PYTHONPATH=scripts python3 -m detection_rules metrics
          PYTHONPATH=scripts python3 -m detection_rules gap
          PYTHONPATH=scripts python3 -m detection_rules cti
          PYTHONPATH=scripts python3 -m detection_rules atomic
          PYTHONPATH=scripts python3 -m detection_rules navigator
          PYTHONPATH=scripts python3 -m detection_rules badges

      - name: Translate Sigma to all backends
        run: |
          mkdir -p dist/sigma-converted

          echo "::group::Elastic Lucene"
          sigma convert -t lucene -f json -o dist/sigma-converted/elastic.json sigma/ 2>&1 | tail -5 || echo "elastic Lucene partial/failed"
          echo "::endgroup::"

          echo "::group::Elastic ECS NDJSON (Kibana importable)"
          sigma convert -t lucene -f kibana_ndjson -o dist/sigma-converted/elastic.ndjson sigma/ 2>&1 | tail -5 || echo "elastic NDJSON partial/failed"
          echo "::endgroup::"

          echo "::group::Splunk SPL"
          sigma convert -t splunk -f default -o dist/sigma-converted/splunk.spl sigma/ 2>&1 | tail -5 || echo "splunk partial/failed"
          echo "::endgroup::"

          echo "::group::QRadar AQL (skipped - backend incompatible with current pysigma)"
          echo "QRadar conversion skipped: pysigma-backend-qradar-aql still pins pysigma<0.12"
          echo "Will be re-added when backend is updated to support pysigma 1.x"
          echo "::endgroup::"

          echo "::group::Kusto (M365 Defender + Sentinel)"
          sigma convert -t kusto -o dist/sigma-converted/kusto.kql sigma/ 2>&1 | tail -5 || echo "kusto partial/failed"
          echo "::endgroup::"

          echo "::group::CrowdStrike Falcon"
          sigma convert -t crowdstrike_splunk -o dist/sigma-converted/crowdstrike.spl sigma/ 2>&1 | tail -5 || echo "crowdstrike partial/failed"
          echo "::endgroup::"

          echo "::group::Conversion summary"
          ls -la dist/sigma-converted/
          echo "::endgroup::"

      - name: Bundle release artifacts
        run: |
          TAG="${{ github.ref_name }}"
          [ -z "$TAG" ] && TAG="${{ github.event.inputs.tag }}"
          BUNDLE_DIR="dist/detection-rules-${TAG}"
          mkdir -p "$BUNDLE_DIR"

          # Native rules per platform
          cp -r sigma                "$BUNDLE_DIR/"
          cp -r elastic              "$BUNDLE_DIR/"
          cp -r splunk               "$BUNDLE_DIR/"
          cp -r microsoft-sentinel   "$BUNDLE_DIR/"
          cp -r wazuh                "$BUNDLE_DIR/"
          cp -r carbonblack          "$BUNDLE_DIR/"

          # Metadata
          cp README.md CHANGELOG.md LICENSE COVERAGE.md \
             rules.index.json rules.index.yaml coverage.json \
             "$BUNDLE_DIR/" 2>/dev/null || true

          # Auto-translated artifacts
          cp -r dist/sigma-converted "$BUNDLE_DIR/sigma-converted"

          # Quick reference
          cat > "$BUNDLE_DIR/RELEASE_NOTES.md" <<EOF
          # Detection Rules ${TAG}

          ## Contents

          - \`sigma/\`              : Sigma rules (.yml) — generic
          - \`elastic/\`            : Elastic .ndjson saved objects
          - \`splunk/\`             : Splunk SPL searches
          - \`microsoft-sentinel/\` : KQL hunting/analytics queries
          - \`wazuh/\`              : Wazuh XML rules (group "attack")
          - \`carbonblack/\`        : Carbon Black JSON queries
          - \`sigma-converted/\`    : Auto-translated Sigma → other backends

          ## Quick start

          \`\`\`bash
          # Elastic
          curl -k -u elastic:\$PASS -H 'kbn-xsrf: true' \\
            -F file=@elastic/endpoint/windows/<rule>.ndjson \\
            https://kibana:5601/api/saved_objects/_import

          # Wazuh
          sudo cp wazuh/rules/*.xml /var/ossec/etc/rules/
          sudo systemctl restart wazuh-manager

          # Splunk
          # Paste isi .spl ke Correlation Search atau Scheduled Search

          # Sentinel
          # Paste isi .kql ke Hunting → New Query
          \`\`\`

          See \`README.md\` and \`docs/quality.md\` for full guidance.

          ## Auto-translated artifacts

          Generated dari \`sigma/\` via \`sigma-cli\` di GitHub Actions.
          Verifikasi di staging sebelum deploy ke produksi.

          ## Coverage

          Lihat \`COVERAGE.md\` atau \`coverage.json\` (ATT&CK Navigator).
          EOF

          cd dist
          zip -r "detection-rules-${TAG}.zip" "$(basename "$BUNDLE_DIR")"
          tar -czf "detection-rules-${TAG}.tar.gz" "$(basename "$BUNDLE_DIR")"
          ls -la

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cyclonedx.json

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json

      - name: Stage every published asset into dist/
        run: |
          # Collect all individually-published assets so checksums + signatures
          # cover exactly what the release exposes (not just the archives).
          cp coverage.json rules.index.json dist/ 2>/dev/null || true
          # Flatten sigma-converted outputs with a prefix to avoid collisions.
          if [ -d dist/sigma-converted ]; then
            for f in dist/sigma-converted/*; do
              [ -f "$f" ] || continue
              cp "$f" "dist/sigma-converted-$(basename "$f")"
            done
          fi

      - name: Generate checksums for all assets
        working-directory: dist
        run: |
          # Checksum every regular file except signatures/certs (generated later).
          find . -maxdepth 1 -type f \
            ! -name 'checksums.txt' ! -name '*.sig' ! -name '*.pem' \
            -printf '%f\n' | sort | xargs sha256sum > checksums.txt
          cat checksums.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign every published asset (keyless)
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: |
          for f in $(find . -maxdepth 1 -type f ! -name '*.sig' ! -name '*.pem' -printf '%f\n'); do
            echo "Signing $f"
            cosign sign-blob --yes "$f" \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem"
          done
          ls -la

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          name: Detection Rules ${{ github.ref_name || github.event.inputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
            dist/sbom.cyclonedx.json
            dist/sbom.spdx.json
            dist/coverage.json
            dist/rules.index.json
            dist/sigma-converted-*
            dist/*.sig
            dist/*.pem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
