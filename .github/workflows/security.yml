name: Security scan

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/security.yml'
  schedule:
    # Weekly run for drift detection
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: python
          queries: security-and-quality
      - name: Auto-build
        uses: github/codeql-action/autobuild@v4.37.7
      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:python"

  bandit:
    name: Bandit (Python static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Bandit
        run: pip install "bandit[toml]==1.8.0"
      - name: Run Bandit
        # `--severity-level medium` filters out low-severity findings.
        # `--confidence-level medium` filters out low-confidence findings.
        run: bandit -r scripts/ --severity-level medium --confidence-level medium

  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install "pip-audit==2.8.0"
      - name: Audit pinned dependencies
        # --strict fails on every vulnerability except PYSEC-2026-2447. That
        # advisory affects diskcache, a transitive sigma-cli dependency, and
        # has no upstream fixed release as of 2026-08-01. Revisit on every
        # Dependabot update and remove this narrow exception once fixed.
        run: pip-audit -r requirements-dev.txt --strict --ignore-vuln PYSEC-2026-2447
