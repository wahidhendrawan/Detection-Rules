name: Sigma Spec Check
on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly on Monday at 09:00 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  sigma-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install sigma-cli
        run: pip install sigma-cli==1.0.4
      - name: Run sigma check
        id: check
        run: |
          find sigma/ -name '*.yml' -not -path '*/correlations/*' -print0 | \
            xargs -0 sigma check > sigma-check-output.txt 2>&1 || echo "issues_found=true" >> "$GITHUB_OUTPUT"
          cat sigma-check-output.txt
      - name: Create or update tracking issue
        if: steps.check.outputs.issues_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('sigma-check-output.txt', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            const marker = '<!-- sigma-spec-check-tracking-issue -->';
            const body = [
              marker,
              '## Sigma Spec Check Results',
              '',
              `Latest run: **${today}** ` +
                `([workflow run](${context.serverUrl}/${context.repo.owner}/` +
                `${context.repo.repo}/actions/runs/${context.runId}))`,
              '',
              '```',
              output.trim(),
              '```',
            ].join('\n');

            // Look for an existing open tracking issue (matched by the HTML
            // marker in the body, so title changes do not create duplicates).
            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'automation,sigma',
                per_page: 100,
              }
            );
            const tracker = existing.find(
              (i) => i.body && i.body.includes(marker) && !i.pull_request
            );

            if (tracker) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracker.number,
                title: `Sigma spec check found issues (last seen ${today})`,
                body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracker.number,
                body: `Sigma spec check still failing as of ${today}. ` +
                  `See the issue body for the latest output.`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Sigma spec check found issues (last seen ${today})`,
                body,
                labels: ['automation', 'sigma'],
              });
            }

      - name: Close tracking issue if now green
        if: steps.check.outputs.issues_found != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- sigma-spec-check-tracking-issue -->';
            const today = new Date().toISOString().slice(0, 10);
            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'automation,sigma',
                per_page: 100,
              }
            );
            const tracker = existing.find(
              (i) => i.body && i.body.includes(marker) && !i.pull_request
            );
            if (tracker) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracker.number,
                body: `Sigma spec check is green as of ${today}. ` +
                  `Auto-closing this tracking issue.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracker.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
