# Title: Proc Self Exe Overwrite Attempt
# Description: Detects attempts to open proc self exe for writing, an escape primitive.
# Author: Security Team
# Date: 2026-08-01
# MITRE ATT&CK: T1611
# Tactic: Privilege Escalation
# Severity: Critical
# References:
#   - https://attack.mitre.org/techniques/T1611/

- rule: Proc Self Exe Overwrite Attempt
  desc: Detects attempts to open proc self exe for writing, an escape primitive.
  condition: >
    open_write and container and (fd.name=/proc/self/exe or fd.name contains /proc/ and fd.name endswith /exe)
  output: >
    Container attempted proc self exe overwrite (user=%user.name command=%proc.cmdline container_id=%container.id image=%container.image.repository)
  priority: CRITICAL
  tags:
    - container
    - mitre_privilege_escalation
    - T1611
