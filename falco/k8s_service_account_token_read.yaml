# Title: Kubernetes Service Account Token Read
# Description: Detects reads of Kubernetes service account tokens by unusual processes.
# Author: Security Team
# Date: 2026-08-01
# MITRE ATT&CK: T1528
# Tactic: Credential Access
# Severity: High
# References:
#   - https://attack.mitre.org/techniques/T1528/

- rule: Kubernetes Service Account Token Read
  desc: Detects reads of Kubernetes service account tokens by unusual processes.
  condition: >
    open_read and container and fd.name contains /var/run/secrets/kubernetes.io/serviceaccount/token and not proc.name in (kube-proxy, kubelet)
  output: >
    Kubernetes service account token read (user=%user.name command=%proc.cmdline container_id=%container.id image=%container.image.repository)
  priority: WARNING
  tags:
    - container
    - mitre_credential_access
    - T1528
