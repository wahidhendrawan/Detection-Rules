# Title: Credential File Read in Container
# Description: Detects access to passwd, shadow, or cloud credential files.
# Author: Security Team
# Date: 2026-08-01
# MITRE ATT&CK: T1003.008
# Tactic: Credential Access
# Severity: High
# References:
#   - https://attack.mitre.org/techniques/T1003/

- rule: Credential File Read in Container
  desc: Detects access to passwd, shadow, or cloud credential files.
  condition: >
    open_read and container and (fd.name=/etc/shadow or fd.name contains /.aws/credentials or fd.name contains /.config/gcloud/)
  output: >
    Credential file read in container (user=%user.name command=%proc.cmdline container_id=%container.id image=%container.image.repository)
  priority: WARNING
  tags:
    - container
    - mitre_credential_access
    - T1003.008
