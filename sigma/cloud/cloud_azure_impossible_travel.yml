title: Azure AD Sign-In from Impossible Travel Location
id: 7c2d9e4f-3a1b-4d6e-8f5c-2b9a7e0d1c3f
status: experimental
description: Detects Azure AD sign-in events flagged as originating from geographically impossible travel locations.
author: Wahid Hendrawan
date: 2026/06/04
references:
    - https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks
logsource:
    product: azure
    service: signinlogs
detection:
    selection:
        properties.message: Impossible travel
        Status.errorCode: 0
    condition: selection
falsepositives:
    - Users with VPN connections that change geographic location
    - Shared accounts used by team members in different regions
level: high
tags:
    - attack.initial_access
    - attack.t1078.004
