title: Cloud Admin Role Assigned
id: fac76196-0ad9-4e83-9b2d-1e751db92651
status: experimental
description: |
  Detects indicators of Cloud Admin Role Assigned (T1098.003).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1098/003/
logsource:
  product: aws
  category: process_creation
detection:
  selection:
    eventName:
      - 'AttachUserPolicy'
      - 'AttachGroupPolicy'
      - 'PutUserPolicy'
    requestParameters.policyArn|contains:
      - 'AdministratorAccess'
      - 'IAMFullAccess'
      - 'PowerUserAccess'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Authorized IAM admin provisioning.
  - IaC (Terraform) managing policies.
level: high
tags:
  - attack.t1098.003
  - attack.persistence
