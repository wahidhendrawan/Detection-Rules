title: GCP Service Account Key Created
id: 5e8f1a3b-9c2d-4b7e-a6f0-1d4c8e3b2a9f
status: experimental
description: Detects creation of a new key for a GCP service account, which could be used to establish persistent access.
author: Wahid Hendrawan
date: 2026/06/04
references:
    - https://cloud.google.com/iam/docs/creating-managing-service-account-keys
logsource:
    product: gcp
    service: gcp.audit
detection:
    selection:
        gcp.audit.method_name: google.iam.admin.v1.CreateServiceAccountKey
    condition: selection
falsepositives:
    - Legitimate key rotation by administrators
    - Automated CI/CD pipelines creating short-lived keys
level: medium
tags:
    - attack.persistence
    - attack.t1098.001
