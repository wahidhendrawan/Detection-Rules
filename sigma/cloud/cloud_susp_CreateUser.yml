title: Suspicious Cloud Action CreateUser
id: 9da46b40-6dc5-4948-a572-3f2c3e79140e
status: experimental
description: |
  Detects sensitive cloud action CreateUser.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: aws
  category: cloudtrail
  service: cloudtrail
detection:
  selection:
    EventName: CreateUser
  condition: selection
fields:
  - UserIdentityArn
falsepositives:
  - Aktivitas administratif rutin yang sah dengan signature trusted.
  - Software install / update legit (verifikasi via parent process & signer).
level: high
tags:
  - attack.persistence
  - attack.t1059
