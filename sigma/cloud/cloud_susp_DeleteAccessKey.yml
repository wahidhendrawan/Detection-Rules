title: Suspicious Cloud Action DeleteAccessKey
id: 5057fc46-470a-47e1-862d-267c4e2ba4bb
status: experimental
description: |
  Detects sensitive cloud action DeleteAccessKey.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: aws
  category: cloudtrail
  service: cloudtrail
detection:
  selection:
    EventName: DeleteAccessKey
  condition: selection
fields:
  - UserIdentityArn
falsepositives:
  - Aktivitas administratif rutin yang sah dengan signature trusted.
  - Software install / update legit (verifikasi via parent process & signer).
level: high
tags:
  - attack.persistence
  - attack.t1059
