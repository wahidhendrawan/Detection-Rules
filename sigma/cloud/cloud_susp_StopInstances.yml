title: Suspicious Cloud Action StopInstances
id: 56954040-3618-4594-a300-d59c01eaf6f8
status: experimental
description: |
  Detects sensitive cloud action StopInstances.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: aws
  category: cloudtrail
  service: cloudtrail
detection:
  selection:
    EventName: StopInstances
  condition: selection
fields:
  - UserIdentityArn
falsepositives:
  - Aktivitas administratif rutin yang sah dengan signature trusted.
  - Software install / update legit (verifikasi via parent process & signer).
level: high
tags:
  - attack.persistence
