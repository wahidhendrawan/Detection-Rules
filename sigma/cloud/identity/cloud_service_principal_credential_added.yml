title: Service Principal Credential Added
id: 07e8cc6f-c9c2-4934-8d7c-6aae811cbfc5
status: experimental
description: |
  Detects credentials added to a service principal.
author: Security Team
date: 2026/08/01
references:
  - https://attack.mitre.org/techniques/T1098/
logsource:
  product: azure
  service: audit
detection:
  selection:
    operationName|contains:
      - 'Add service principal credentials'
      - 'Update application - Certificates and secrets management'
    result: 'success'
  condition: selection
fields:
  - user
  - source.ip
  - eventType
  - outcome.result
falsepositives:
  - Authorized administrative activity matching this behavior.
level: critical
tags:
  - attack.t1098.001
  - attack.persistence
