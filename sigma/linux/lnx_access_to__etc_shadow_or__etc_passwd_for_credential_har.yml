title: Access to /etc/shadow or /etc/passwd for Credential Harvesting
id: 107d05d0-e49f-46cf-a43c-29fdd78a8483
status: experimental
description: |
  Detects indicators of Access to /etc/shadow or /etc/passwd for Credential Harvesting (T1003.008).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1003/008/
logsource:
  product: linux
  category: file_access
detection:
  selection:
    TargetFilename:
      - '/etc/shadow'
      - '/etc/passwd'
  filter_legit:
    Image|endswith:
      - '/passwd'
      - '/useradd'
      - '/usermod'
      - '/chpasswd'
  condition: selection and not filter_legit
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - User management tools (passwd, useradd, usermod).
  - PAM authentication modules.
level: high
tags:
  - attack.t1003.008
  - attack.credential-access
