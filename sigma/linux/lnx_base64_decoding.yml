title: Base64 Decoding in Shell
id: 2a5b3b88-f26e-4a9a-b885-d0f41aca3362
status: experimental
description: |
  Detects the usage of base64 decoding in shell commands. This is often used to
  obfuscate malicious scripts or commands.
author: Wahid Hendrawan
date: 2025/05/22
logsource:
  product: linux
  category: process_creation
detection:
  selection_command:
    CommandLine|contains:
      - 'base64 -d'
      - 'base64 --decode'
  selection_pipe:
    CommandLine|contains:
      - '| base64'
  condition: selection_command or selection_pipe
fields:
  - Image
  - CommandLine
  - User
  - ParentImage
falsepositives:
  - Legitimate administrative scripts passing data.
level: medium
tags:
  - attack.t1027
  - attack.t1059
  - attack.defense_evasion
