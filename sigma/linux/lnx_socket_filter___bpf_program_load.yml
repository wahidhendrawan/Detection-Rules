title: Socket Filter / BPF Program Load
id: 29c01b43-c7ad-49b9-945f-b98b7a0b2037
status: experimental
description: |
  Detects indicators of Socket Filter / BPF Program Load (T1205.002).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1205/002/
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'bpftool'
      - 'tc filter add'
      - 'raw_socket'
      - 'AF_PACKET'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Network monitoring tools (tcpdump, wireshark).
  - eBPF-based security tools.
level: medium
tags:
  - attack.t1205.002
  - attack.defense-evasion
