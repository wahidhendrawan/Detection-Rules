title: SSH Connection to Internal Host (Lateral Movement Indicator)
id: 4a6c1d93-e5b2-4f8a-c7d1-3b9e2f8a6c54
status: experimental
description: |
  Detects successful SSH connections which, when seen from the same
  source to multiple internal hosts in rapid succession, may indicate
  lateral movement. Tune threshold per environment.
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1021/004/
logsource:
  product: linux
  service: sshd
detection:
  selection:
    status: 'Accepted'
  condition: selection
fields:
  - src_ip
  - dst_ip
  - user
falsepositives:
  - Admin yang sah SSH ke banyak server untuk maintenance.
  - Ansible/Salt/Puppet yang push config ke banyak host.
level: medium
tags:
  - attack.t1021.004
  - attack.lateral-movement
