title: Suspicious Usage of g++
id: 28441ee9-2262-4923-bc65-7cf28dbf5365
status: experimental
description: |
  Detects suspicious usage of g++ in command line.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: linux
  category: process_creation

detection:
  selection:
    CommandLine|contains: 'g++'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - Aktivitas administratif rutin yang menjalankan binary tersebut.
  - Software install / update signed yang spawn proses tersebut.
level: medium
tags:
  - attack.execution
