title: Suspicious Usage of netcat
id: 921c2ff5-a992-49fc-8974-2a809ac64997
status: experimental
description: |
  Detects suspicious usage of netcat in command line.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: linux
  category: process_creation

detection:
  selection:
    CommandLine|contains: 'netcat'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - Aktivitas administratif rutin yang menjalankan binary tersebut.
  - Software install / update signed yang spawn proses tersebut.
level: medium
tags:
  - attack.execution
