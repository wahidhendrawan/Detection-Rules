title: Suspicious Usage of python
id: 08d38825-fb79-4329-8bd5-d94ad943f07e
status: experimental
description: |
  Detects suspicious usage of python in command line.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: linux
  category: process_creation

detection:
  selection:
    CommandLine|contains: 'python'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - Aktivitas administratif rutin yang menjalankan binary tersebut.
  - Software install / update signed yang spawn proses tersebut.
level: medium
tags:
  - attack.execution
