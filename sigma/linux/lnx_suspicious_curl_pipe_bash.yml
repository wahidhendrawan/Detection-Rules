title: Suspicious Curl or Wget Piped to Shell
author: Wahid Hendrawan
date: 2026/05/21
id: 7fdb2f8b-3f8f-40ad-a9bc-5d69792ecf0c
status: high
description: |
  Detects potential one-liner download-and-execute behavior on Linux where curl or wget output
  is piped directly into a shell interpreter.
logsource:
  product: linux
  category: process_creation
detection:
  selection_download:
    CommandLine|contains:
      - 'curl '
      - 'wget '
  selection_pipe:
    CommandLine|contains:
      - '| sh'
      - '| bash'
      - '|/bin/sh'
      - '|/bin/bash'
  condition: selection_download and selection_pipe
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - Administrative scripts executed in trusted environments.
level: high
tags:
  - attack.execution
  - attack.t1059.004
