title: macOS Keychain Credential Access
id: 900e62d3-8384-4b4d-99a5-6cc0668a3ef9
status: experimental
description: |
  Detects security commands that dump or search Keychain secrets.
author: Security Team
date: 2026/08/01
references:
  - https://attack.mitre.org/techniques/T1555/
logsource:
  product: macos
  category: process_creation
detection:
  selection:
    Image|endswith: '/security'
    CommandLine|contains:
      - 'dump-keychain'
      - 'find-generic-password'
      - 'find-internet-password'
      - '-w'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Authorized administrative activity matching this behavior.
level: high
tags:
  - attack.t1555.001
  - attack.credential_access
