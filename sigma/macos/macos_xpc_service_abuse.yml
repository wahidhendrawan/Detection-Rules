title: macOS XPC Service Abuse
id: 145bfdf3-e90d-4e5e-93ef-899c89b50221
status: experimental
description: |
  Detects suspicious launchctl operations targeting XPC services.
author: Security Team
date: 2026/08/01
references:
  - https://attack.mitre.org/techniques/T1543/
logsource:
  product: macos
  category: process_creation
detection:
  selection:
    Image|endswith: '/launchctl'
    CommandLine|contains:
      - 'bootstrap'
      - 'kickstart'
      - 'submit'
    CommandLine|contains|all:
      - 'xpc'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Authorized administrative activity matching this behavior.
level: high
tags:
  - attack.t1543.001
  - attack.persistence
