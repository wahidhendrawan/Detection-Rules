title: Suspicious DNS Tunnel-Like Queries
id: b5f700fd-c352-4cd0-9ebb-5e035714bb41
status: experimental
description: |
  Mendeteksi pola query DNS yang mirip tunneling (label sangat panjang,
  random, dan berulang ke domain yang sama).
author: Wahid Hendrawan
date: 2025/11/27
logsource:
  category: dns
  product: network
detection:
  selection:
    query_length|gte: 80
    query|contains: "."
  condition: selection
fields:
  - client_ip
  - server_ip
  - query
  - query_type
  - response_code
falsepositives:
  - Aplikasi legitimate yang menggunakan DNS untuk telemetry atau load balancing
level: high
tags:
  - attack.t1071
  - attack.t1071.004
  - attack.command-and-control
