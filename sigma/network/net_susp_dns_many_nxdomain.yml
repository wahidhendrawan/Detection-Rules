title: High Volume NXDOMAIN DNS Responses
author: Wahid Hendrawan
date: 2026/05/21
id: 273c0578-7874-4fc1-81f0-cb934cd7d6ef
status: medium
description: |
  Detects potential DNS tunneling or malware beaconing by identifying unusually high
  volumes of NXDOMAIN DNS responses from a single source host.
logsource:
  product: network
  service: dns
detection:
  selection:
    dns.response_code: 'NXDOMAIN'
  condition: selection
fields:
  - src_ip
  - dns.question.name
  - dns.response_code
falsepositives:
  - Misconfigured applications or hosts repeatedly querying invalid domains.
level: medium
tags:
  - attack.command_and_control
  - attack.t1071.004
