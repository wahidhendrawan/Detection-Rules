title: Suspicious FTP Traffic
id: eb599863-b0fc-46cf-8d64-394be71823d6
status: experimental
description: |
  Detects potential abuse or anomalies in FTP traffic.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: network
  category: firewall

detection:
  selection:
    Protocol: ftp
  condition: selection
fields:
  - DestinationPort
falsepositives:
  - Aktivitas administratif rutin yang sah dengan signature trusted.
  - Software install / update legit (verifikasi via parent process & signer).
level: medium
tags:
  - attack.command-and-control
