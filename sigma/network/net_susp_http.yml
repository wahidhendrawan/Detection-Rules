title: Suspicious HTTP Traffic
id: 26c14386-6d04-415c-b1b4-64ed20751d2f
status: experimental
description: |
  Detects potential abuse or anomalies in HTTP traffic.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: network
  category: firewall

detection:
  selection:
    Protocol: http
  condition: selection
fields:
  - DestinationPort
falsepositives:
  - Aktivitas administratif rutin yang sah dengan signature trusted.
  - Software install / update legit (verifikasi via parent process & signer).
level: medium
tags:
  - attack.command-and-control
  - attack.t1059
