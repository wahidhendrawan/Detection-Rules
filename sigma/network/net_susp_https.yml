title: Suspicious HTTPS Traffic
id: 1ccacd62-58a2-4b46-a412-c1f70c7499c1
status: experimental
description: |
  Detects potential abuse or anomalies in HTTPS traffic.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: network
  category: firewall

detection:
  selection:
    Protocol: https
  condition: selection
fields:
  - DestinationPort
falsepositives:
  - Aktivitas administratif rutin yang sah dengan signature trusted.
  - Software install / update legit (verifikasi via parent process & signer).
level: medium
tags:
  - attack.command-and-control
  - attack.t1059
