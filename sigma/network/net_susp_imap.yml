title: Suspicious IMAP Traffic
id: 55f0182a-5f6d-44a3-b4a0-75ee6d270003
status: experimental
description: |
  Detects potential abuse or anomalies in IMAP traffic.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: network
  category: firewall

detection:
  selection:
    Protocol: imap
  condition: selection
fields:
  - DestinationPort
falsepositives:
  - Aktivitas administratif rutin yang sah dengan signature trusted.
  - Software install / update legit (verifikasi via parent process & signer).
level: medium
tags:
  - attack.command-and-control
  - attack.t1059
