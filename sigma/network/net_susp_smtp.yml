title: Suspicious SMTP Traffic
id: a9394dd4-3338-4af2-ae2b-55102554ccf1
status: experimental
description: |
  Detects potential abuse or anomalies in SMTP traffic.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: network
  category: firewall

detection:
  selection:
    Protocol: smtp
  condition: selection
fields:
  - DestinationPort
falsepositives:
  - Aktivitas administratif rutin yang sah dengan signature trusted.
  - Software install / update legit (verifikasi via parent process & signer).
level: medium
tags:
  - attack.command-and-control
  - attack.t1059
