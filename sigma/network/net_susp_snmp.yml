title: Suspicious SNMP Traffic
id: dfbe56fa-5f52-46b8-9590-f4d04e570abc
status: experimental
description: |
  Detects potential abuse or anomalies in SNMP traffic.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: network
  category: firewall

detection:
  selection:
    Protocol: snmp
  condition: selection
fields:
  - DestinationPort
falsepositives:
  - Aktivitas administratif rutin yang sah dengan signature trusted.
  - Software install / update legit (verifikasi via parent process & signer).
level: medium
tags:
  - attack.command-and-control
  - attack.t1059
