title: Suspicious SSH Traffic
id: 4418ead0-8645-44e1-99ee-0764c194e3b7
status: experimental
description: |
  Detects potential abuse or anomalies in SSH traffic.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: network
  category: firewall

detection:
  selection:
    Protocol: ssh
  condition: selection
fields:
  - DestinationPort
falsepositives:
  - User legit yang sukses authenticate.
  - Service account dengan token rotation.
  - Admin yang sah memodifikasi user.
level: medium
tags:
  - attack.command-and-control
