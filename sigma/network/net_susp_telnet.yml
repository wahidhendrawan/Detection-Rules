title: Suspicious TELNET Traffic
id: eeaf6bcb-b699-4f94-b794-f8fc847dd029
status: experimental
description: |
  Detects potential abuse or anomalies in TELNET traffic.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: network
  category: firewall

detection:
  selection:
    Protocol: telnet
  condition: selection
fields:
  - DestinationPort
falsepositives:
  - Aktivitas administratif rutin yang sah dengan signature trusted.
  - Software install / update legit (verifikasi via parent process & signer).
level: medium
tags:
  - attack.command-and-control
  - attack.t1059
