title: Exfiltration Over Alternative Protocol
id: e6af02c8-e8cd-42c3-a9db-5c109c3c66e4
status: experimental
description: |
  Detects indicators of Exfiltration Over Alternative Protocol (T1048).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1048/
logsource:
  product: windows
  category: network_connection
detection:
  selection:
    DestinationPort:
      - 53
      - 443
      - 8443
    Image|endswith:
      - '\\powershell.exe'
      - '\\cmd.exe'
  filter_dns:
    DestinationPort: 53
    Image|endswith: '\\svchost.exe'
  condition: selection and not filter_dns
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - PowerShell scripts making HTTPS API calls.
  - CLI tools with web requests.
level: low
tags:
  - attack.t1048
  - attack.exfiltration
