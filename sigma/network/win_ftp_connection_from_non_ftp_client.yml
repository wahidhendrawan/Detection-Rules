title: FTP Connection from Non-FTP Client
id: 1dc70379-eab4-4fb7-895b-419a5dbe7920
status: experimental
description: |
  Detects indicators of FTP Connection from Non-FTP Client (T1071.002).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1071/002/
logsource:
  product: windows
  category: network_connection
detection:
  selection:
    DestinationPort:
      - 21
      - 990
  filter_ftp:
    Image|endswith:
      - '\\ftp.exe'
      - '\\FileZilla.exe'
      - '\\WinSCP.exe'
  condition: selection and not filter_ftp
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Custom application using FTP port.
level: medium
tags:
  - attack.t1071.002
  - attack.command-and-control
