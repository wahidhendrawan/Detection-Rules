title: At Job Creation
id: 5370fb8c-983c-4870-a696-2ff7fd6f8f43
status: experimental
description: |
  Detects indicators of At Job Creation (T1053.002).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1053/002/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\\at.exe'
    CommandLine|contains:
      - '/interactive'
      - '/every'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Legacy scheduled tasks (at.exe deprecated but still present).
level: medium
tags:
  - attack.t1053.002
  - attack.persistence
