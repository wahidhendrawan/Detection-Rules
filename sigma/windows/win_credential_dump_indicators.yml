title: Credential Dumping Tool Indicators
id: 8b2d4e91-c5a3-4f7e-d1b6-9a3c2f8e5d74
status: experimental
description: |
  Detects command-line indicators of common credential dumping tools
  (Mimikatz, secretsdump, LaZagne, SharpDump).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1003/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'sekurlsa::logonpasswords'
      - 'sekurlsa::wdigest'
      - 'lsadump::sam'
      - 'lsadump::dcsync'
      - 'secretsdump'
      - 'SharpDump'
      - 'LaZagne'
      - 'pypykatz'
      - 'nanodump'
      - 'handlekatz'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
  - ParentImage
falsepositives:
  - Penetration testing atau red teaming yang terotorisasi.
level: critical
tags:
  - attack.t1003
  - attack.t1003.001
  - attack.credential-access
