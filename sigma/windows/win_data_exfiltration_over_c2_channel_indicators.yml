title: Data Exfiltration Over C2 Channel Indicators
id: 4b3a484f-d61c-4ac4-8725-20aac5c5cf46
status: experimental
description: |
  Detects indicators of Data Exfiltration Over C2 Channel Indicators (T1041).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1041/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - '-PostFile'
      - 'Invoke-WebRequest.*-Body'
      - 'curl.*--data-binary'
      - 'wget.*--post-file'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Legitimate file upload scripts.
  - CI/CD artifact upload.
level: medium
tags:
  - attack.t1041
  - attack.exfiltration
