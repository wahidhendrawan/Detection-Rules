title: Denial of Service Indicators
id: f1dc4ddd-7be9-400e-bd69-8265913d401d
status: experimental
description: |
  Detects indicators of Denial of Service Indicators (T1499).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1499/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\\LOIC.exe'
      - '\\hping3.exe'
      - '\\slowloris.exe'
    CommandLine|contains:
      - 'flood'
      - 'stress'
      - 'syn'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Authorized penetration testing.
level: critical
tags:
  - attack.t1499
  - attack.impact
