title: Windows Event Logging Disabled
id: a1b2c3d4-7777-4aaa-b777-000000000007
status: experimental
description: |
  Detects attempts to disable Windows event logging via auditpol,
  wevtutil, or registry modification.
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1562/002/
logsource:
  product: windows
  category: process_creation
detection:
  selection_auditpol:
    Image|endswith: '\auditpol.exe'
    CommandLine|contains:
      - '/set'
      - '/clear'
      - 'disable'
  selection_wevtutil:
    Image|endswith: '\wevtutil.exe'
    CommandLine|contains:
      - 'sl'
      - '/e:false'
  selection_service:
    Image|endswith: '\sc.exe'
    CommandLine|contains|all:
      - 'stop'
      - 'EventLog'
  condition: 1 of selection_*
fields:
  - Image
  - CommandLine
  - User
  - ParentImage
falsepositives:
  - Admin yang sah tuning audit policy (seharusnya via GPO bukan manual).
level: high
tags:
  - attack.t1562.002
  - attack.defense-evasion
