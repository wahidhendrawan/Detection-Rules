title: Group Policy Object Modification via PowerShell or CLI
id: a1b2c3d4-cccc-4aaa-bccc-000000000012
status: experimental
description: |
  Detects modification of Group Policy Objects via command-line tools
  which may indicate privilege escalation or persistence.
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1484/001/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'Set-GPRegistryValue'
      - 'New-GPO'
      - 'Set-GPPermission'
      - 'gpscript'
      - 'lgpo.exe'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
  - ParentImage
falsepositives:
  - AD administrator yang mengelola GPO via PowerShell (biasa via GPMC).
level: high
tags:
  - attack.t1484.001
  - attack.privilege-escalation
