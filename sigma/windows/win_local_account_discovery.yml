title: Local Account Discovery
id: 9d5d5cfc-8a2b-45f2-8fd2-fc0aa6cc70a6
status: experimental
description: |
  Detects indicators of Local Account Discovery (T1087.001).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1087/001/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\\net.exe'
    CommandLine|contains: 'user'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Legitimate administrative activity.
  - Authorized security testing.
level: medium
tags:
  - attack.t1087.001
  - attack.discovery
