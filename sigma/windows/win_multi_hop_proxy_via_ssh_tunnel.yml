title: Multi-hop Proxy via SSH Tunnel
id: 0490ac64-0c75-491a-a756-eba250be30d9
status: experimental
description: |
  Detects indicators of Multi-hop Proxy via SSH Tunnel (T1090.003).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1090/003/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\\ssh.exe'
      - '\\plink.exe'
    CommandLine|contains:
      - '-D '
      - '-L '
      - '-R '
      - 'DynamicForward'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Developers using SSH tunnels for database access.
level: medium
tags:
  - attack.t1090.003
  - attack.command-and-control
