title: Multiple Failed Login Attempts
id: 5f5975e0-c196-43fa-8f7e-2dfa5a72c6fa
status: experimental
description: |
  Detects indicators of Multiple Failed Login Attempts (T1110).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1110/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 4625
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - User mistyping password.
  - Expired service account credentials.
level: informational
tags:
  - attack.t1110
  - attack.credential-access
