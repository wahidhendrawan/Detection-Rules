title: Office Application Spawning Suspicious Child Process
id: 3b8c2d91-5f7a-4e12-b6d8-a1c9f4e3d7b2
status: experimental
description: |
  Detects Microsoft Office applications (Word, Excel, PowerPoint) spawning
  suspicious child processes such as cmd, powershell, wscript, or mshta.
  This is a strong indicator of macro-based spearphishing attachment execution.
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1566/001/
  - https://www.mandiant.com/m-trends
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
      - '\OUTLOOK.EXE'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\certutil.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\bitsadmin.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Legitimate Office add-ins that spawn helper processes
  - Corporate macros calling cmd for file operations (whitelist by CommandLine)
level: high
custom:
  effectiveness: 0.88
  fp_rate: 0.12
  last_tuned: 2026/06/01
  alert_volume: medium
tags:
  - attack.t1566.001
  - attack.initial-access
  - attack.execution
