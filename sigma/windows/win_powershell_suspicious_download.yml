title: Suspicious PowerShell Download
id: 642af3d7-d76c-4b50-bf9b-5875765ee11e
status: experimental
description: |
  Detects suspicious PowerShell commands used to download content from the internet,
  often used by malware droppers (e.g., Net.WebClient, DownloadFile, Invoke-WebRequest).
author: Jules
date: 2025/05/22
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'Net.WebClient'
      - 'DownloadFile'
      - 'Invoke-WebRequest'
      - 'wget'
      - 'curl'
      - 'BitsTransfer'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
  - ParentImage
falsepositives:
  - Administrative scripts downloading updates or legitimate tools.
level: medium
tags:
  - attack.t1059.001
  - attack.execution
