title: Suspicious PowerShell EncodedCommand
id: 62408344-0c4d-4dfa-b82d-5b2ee3a4590c
status: experimental
description: |
  Mendeteksi penggunaan PowerShell dengan parameter -EncodedCommand
  yang sering digunakan untuk obfuscation dan eksekusi payload.
author: Wahid Hendrawan
date: 2025/11/27
logsource:
  product: windows
  service: powershell
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - '-EncodedCommand'
      - '/EncodedCommand'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
  - ParentImage
  - ParentCommandLine
  - ComputerName
falsepositives:
  - Script administrasi yang sah menggunakan encoding untuk alasan kompatibilitas
level: high
tags:
  - attack.t1059
  - attack.t1059.001
  - attack.execution
  - car.2013-05-009
