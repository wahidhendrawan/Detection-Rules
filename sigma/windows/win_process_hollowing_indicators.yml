title: Process Hollowing Indicators
id: 1bfabfa4-601b-48dc-a8a3-2ef9e7578a32
status: experimental
description: |
  Detects indicators of Process Hollowing Indicators (T1055.012).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1055/012/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\\svchost.exe'
      - '\\RuntimeBroker.exe'
      - '\\dllhost.exe'
    ParentImage|endswith:
      - '\\cmd.exe'
      - '\\powershell.exe'
      - '\\wscript.exe'
      - '\\mshta.exe'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Extremely rare legitimate scenario.
level: high
tags:
  - attack.t1055.012
  - attack.defense-evasion
