title: Regsvr32 Suspicious Network or Script Load
id: 95d13c21-149d-47a5-a1e1-47e89188d1a4
status: experimental
description: |
  Detects indicators of Regsvr32 Suspicious Network or Script Load (T1218.010).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1218/010/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\\regsvr32.exe'
    CommandLine|contains:
      - '/i:http'
      - '/i:ftp'
      - 'scrobj.dll'
      - '/s /n /u'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Extremely rare legitimate use of regsvr32 with URLs.
level: high
tags:
  - attack.t1218.010
  - attack.defense-evasion
