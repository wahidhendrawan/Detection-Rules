title: Sandbox Evasion Check
id: d9d2a18d-cae6-4203-999c-6b6b49999ef6
status: experimental
description: |
  Detects indicators of Sandbox Evasion Check (T1497).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1497/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'GetTickCount'
      - 'NtQuerySystemInformation'
      - 'IsDebuggerPresent'
      - 'HARDWARE\\DEVICEMAP'
      - 'HARDWARE\\DESCRIPTION\\System\\BIOS'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Legitimate software checking hardware info.
  - Anti-cheat software.
level: low
tags:
  - attack.t1497
  - attack.defense-evasion
