title: Sandbox Evasion - System Hardware Checks
id: c4d5e6f7-1234-4abc-def0-111111111001
status: experimental
description: |
  Detects queries for VM/sandbox indicators via WMI or registry checks
  commonly used by malware to evade analysis.
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1497/001/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'Win32_ComputerSystem'
      - 'Win32_BIOS'
      - 'HARDWARE\\DESCRIPTION\\System\\BIOS'
      - 'VirtualBox'
      - 'VMware'
      - 'QEMU'
      - 'Xen'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - System inventory tools.
  - Anti-cheat software checking VM.
level: low
tags:
  - attack.t1497.001
  - attack.defense-evasion
