title: Sandbox Evasion - Time-Based Checks
id: c4d5e6f7-1234-4abc-def0-111111111003
status: experimental
description: |
  Detects use of sleep/delay commands or time-check APIs that malware
  uses to evade sandbox analysis (which often fast-forwards time).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1497/003/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'Start-Sleep'
      - 'ping -n 60'
      - 'timeout /t'
      - 'waitfor /t'
      - 'GetTickCount64'
      - 'NtQueryPerformanceCounter'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Legitimate scripts with wait/sleep logic.
  - Installers with progress delays.
level: low
tags:
  - attack.t1497.003
  - attack.defense-evasion
