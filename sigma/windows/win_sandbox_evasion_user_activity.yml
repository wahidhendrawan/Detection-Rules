title: Sandbox Evasion - User Activity Checks
id: c4d5e6f7-1234-4abc-def0-111111111002
status: experimental
description: |
  Detects checks for user interaction indicators (mouse movement,
  recent files, browser history) used by malware to detect sandboxes.
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1497/002/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'GetCursorPos'
      - 'GetLastInputInfo'
      - 'RecentDocs'
      - 'TypedURLs'
      - 'UserAssist'
      - 'RunMRU'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Accessibility software.
  - User activity monitoring tools.
level: low
tags:
  - attack.t1497.002
  - attack.defense-evasion
