title: Scheduled Data Transfer to External
id: 6b72613e-fd9d-4f29-bd08-6952b9ce802c
status: experimental
description: |
  Detects indicators of Scheduled Data Transfer to External (T1029).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1029/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\\schtasks.exe'
    CommandLine|contains:
      - 'ftp'
      - 'http'
      - 'scp'
      - 'curl'
      - 'wget'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Scheduled backup jobs.
  - Automated report delivery.
level: medium
tags:
  - attack.t1029
  - attack.exfiltration
