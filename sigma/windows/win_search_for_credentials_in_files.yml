title: Search for Credentials in Files
id: fb97815b-c9e2-4322-9e90-449ab325ee75
status: experimental
description: |
  Detects indicators of Search for Credentials in Files (T1552).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1552/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'findstr /si password'
      - 'findstr /si pass'
      - 'dir /s *password*'
      - 'dir /s *.kdbx'
      - 'dir /s *credential*'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Security audit scanning for exposed credentials.
level: medium
tags:
  - attack.t1552
  - attack.credential-access
