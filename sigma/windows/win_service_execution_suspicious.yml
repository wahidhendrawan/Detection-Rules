title: Suspicious Service Execution via sc.exe
id: 6f4b1c83-a2d5-4e7f-b8c9-1d3e5f7a9b24
status: experimental
description: |
  Detects sc.exe creating or starting services with suspicious
  binary paths pointing to temp directories or LOLBins.
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1569/002/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\sc.exe'
    CommandLine|contains:
      - 'create'
      - 'start'
  selection_suspicious:
    CommandLine|contains:
      - '\Temp\'
      - '\AppData\'
      - '\Public\'
      - 'cmd.exe /c'
      - 'powershell'
      - 'rundll32'
  condition: selection and selection_suspicious
fields:
  - CommandLine
  - User
  - ParentImage
falsepositives:
  - Admin yang sah membuat service (jarang pakai path temp).
level: high
tags:
  - attack.t1569.002
  - attack.execution
