title: Shadow Copies Deletion
id: 9ad69c92-652b-4d0a-96ea-46dd429a8979
status: experimental
description: |
  Detects attempts to delete volume shadow copies using vssadmin, wmic, or powershell.
  This is a common precursor to ransomware encryption.
author: Wahid Hendrawan
date: 2025/05/22
logsource:
  product: windows
  category: process_creation
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  selection_powershell:
    CommandLine|contains:
      - 'Win32_ShadowCopy'
      - '.Delete()'
  condition: selection_vssadmin or selection_wmic or selection_powershell
fields:
  - Image
  - CommandLine
  - User
  - ComputerName
falsepositives:
  - Legitimate backup software or administration tasks (rarely use wmic/vssadmin manually).
level: critical
tags:
  - attack.t1490
  - attack.impact
