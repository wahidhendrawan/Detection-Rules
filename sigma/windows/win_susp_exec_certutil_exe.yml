title: Suspicious Execution of certutil.exe
id: 3705923d-4c09-49f4-aa72-8c2854e160e9
status: experimental
description: |
  Detects suspicious execution of certutil.exe which may be used for Living off the Land attacks.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith: '\certutil.exe'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - Admin sysadmin yang sah download CRL/CTL.
  - PKI tooling internal (Windows ADCS).
level: medium
tags:
  - attack.execution
  - attack.t1059
