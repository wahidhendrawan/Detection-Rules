title: Suspicious Execution of cipher.exe
id: f9ebf7ef-cc67-4aa4-bd33-eee1d690def2
status: experimental
description: |
  Detects suspicious execution of cipher.exe which may be used for Living off the Land attacks.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith: '\cipher.exe'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - Aktivitas administratif rutin yang menjalankan binary tersebut.
  - Software install / update signed yang spawn proses tersebut.
level: medium
tags:
  - attack.execution
