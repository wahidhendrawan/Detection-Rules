title: Suspicious Execution of cscript.exe
id: 897d64cf-3583-4519-b392-3ba66783a804
status: experimental
description: |
  Detects suspicious execution of cscript.exe which may be used for Living off the Land attacks.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith: '\cscript.exe'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - Legitimate administrative activity
level: medium
tags:
  - attack.execution
