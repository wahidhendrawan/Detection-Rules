title: Suspicious Execution of ipconfig.exe
id: de054ed3-ee0a-4fb7-9581-7a2479527cd5
status: experimental
description: |
  Detects suspicious execution of ipconfig.exe which may be used for Living off the Land attacks.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith: '\ipconfig.exe'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - Aktivitas administratif rutin yang menjalankan binary tersebut.
  - Software install / update signed yang spawn proses tersebut.
level: medium
tags:
  - attack.execution
  - attack.t1059
