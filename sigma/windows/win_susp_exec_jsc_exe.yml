title: Suspicious Execution of jsc.exe
id: b17110aa-e67e-4bf8-ac21-c07bf21acb10
status: experimental
description: |
  Detects suspicious execution of jsc.exe which may be used for Living off the Land attacks.
author: Jules
date: 2026/02/04
logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith: '\jsc.exe'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - Legitimate administrative activity
level: medium
tags:
  - attack.execution
