title: Suspicious Execution of msbuild.exe
id: 31bc2624-5f8f-49d7-8640-931f9f4191a3
status: experimental
description: |
  Detects suspicious execution of msbuild.exe which may be used for Living off the Land attacks.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith: '\msbuild.exe'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - Legitimate administrative activity
level: medium
tags:
  - attack.execution
