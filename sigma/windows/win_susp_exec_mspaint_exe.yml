title: Suspicious Execution of mspaint.exe
id: 067cb4fe-bb2d-485a-a875-2e20a15e2446
status: experimental
description: |
  Detects suspicious execution of mspaint.exe which may be used for Living off the Land attacks.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith: '\mspaint.exe'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - Aktivitas administratif rutin yang menjalankan binary tersebut.
  - Software install / update signed yang spawn proses tersebut.
level: medium
tags:
  - attack.execution
