title: Suspicious Execution of net.exe
id: 34773975-a65e-436f-9d84-2b837ce150e4
status: experimental
description: |
  Detects suspicious execution of net.exe which may be used for Living off the Land attacks.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith: '\net.exe'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - Admin yang menjalankan 'net user' / 'net group' untuk audit.
  - Login script yang map network drive.
level: medium
tags:
  - attack.execution
