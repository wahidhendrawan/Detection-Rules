title: Suspicious Execution of notepad.exe
id: 41bf5c05-e166-4dfe-84f9-018bd8a4ee2d
status: experimental
description: |
  Detects suspicious execution of notepad.exe which may be used for Living off the Land attacks.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith: '\notepad.exe'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - Aktivitas administratif rutin yang menjalankan binary tersebut.
  - Software install / update signed yang spawn proses tersebut.
level: medium
tags:
  - attack.execution
  - attack.t1059
