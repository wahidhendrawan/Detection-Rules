title: Suspicious Execution of regasm.exe
id: a2bf2fb1-2bf5-494e-9224-e90540c4b6ff
status: experimental
description: |
  Detects suspicious execution of regasm.exe which may be used for Living off the Land attacks.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith: '\regasm.exe'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - Aktivitas administratif rutin yang menjalankan binary tersebut.
  - Software install / update signed yang spawn proses tersebut.
level: medium
tags:
  - attack.execution
