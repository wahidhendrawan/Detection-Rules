title: Suspicious Execution of systeminfo.exe
id: 72cee37f-e0b7-4919-9a2c-5882504ee66b
status: experimental
description: |
  Detects suspicious execution of systeminfo.exe which may be used for Living off the Land attacks.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith: '\systeminfo.exe'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - Aktivitas administratif rutin yang menjalankan binary tersebut.
  - Software install / update signed yang spawn proses tersebut.
level: medium
tags:
  - attack.execution
  - attack.t1059
