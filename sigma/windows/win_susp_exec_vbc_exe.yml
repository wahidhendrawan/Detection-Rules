title: Suspicious Execution of vbc.exe
id: 503c30ff-1c9c-4819-aac5-ffe50b3571b1
status: experimental
description: |
  Detects suspicious execution of vbc.exe which may be used for Living off the Land attacks.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith: '\vbc.exe'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - Aktivitas administratif rutin yang menjalankan binary tersebut.
  - Software install / update signed yang spawn proses tersebut.
level: medium
tags:
  - attack.execution
  - attack.t1059
