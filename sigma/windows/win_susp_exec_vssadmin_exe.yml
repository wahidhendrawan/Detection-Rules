title: Suspicious Execution of vssadmin.exe
id: 498791c5-2665-40d9-bd87-8d6112729446
status: experimental
description: |
  Detects suspicious execution of vssadmin.exe which may be used for Living off the Land attacks.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith: '\vssadmin.exe'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - Backup software (Veeam, Commvault, Acronis) yang manage shadow copy.
  - Admin yang manual menjalankan vssadmin saat troubleshoot.
level: medium
tags:
  - attack.execution
  - attack.t1059
