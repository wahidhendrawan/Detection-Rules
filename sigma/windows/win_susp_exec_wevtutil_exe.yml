title: Suspicious Execution of wevtutil.exe
id: 7397fbad-2124-4e95-b05b-6039cf8cbe27
status: experimental
description: |
  Detects suspicious execution of wevtutil.exe which may be used for Living off the Land attacks.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith: '\wevtutil.exe'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - Aktivitas administratif rutin yang menjalankan binary tersebut.
  - Software install / update signed yang spawn proses tersebut.
level: medium
tags:
  - attack.execution
