title: Suspicious Execution of wmic.exe
id: ec00def5-491a-4c90-899b-125a68d977ff
status: experimental
description: |
  Detects suspicious execution of wmic.exe which may be used for Living off the Land attacks.
author: Wahid Hendrawan
date: 2026/02/04
logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith: '\wmic.exe'
  condition: selection
fields:
  - CommandLine
falsepositives:
  - System management tools (SCCM, monitoring) yang pakai WMI/WMIC.
  - Admin script untuk inventory.
level: medium
tags:
  - attack.execution
  - attack.t1059
