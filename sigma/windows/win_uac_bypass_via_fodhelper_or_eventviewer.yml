title: UAC Bypass via Fodhelper or EventViewer
id: 87a1cf01-5e4a-467e-b2cf-9707395e4f6d
status: experimental
description: |
  Detects indicators of UAC Bypass via Fodhelper or EventViewer (T1548.002).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1548/002/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith:
      - '\\fodhelper.exe'
      - '\\eventvwr.exe'
      - '\\computerdefaults.exe'
    Image|endswith:
      - '\\cmd.exe'
      - '\\powershell.exe'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Extremely rare legitimate scenario.
level: high
tags:
  - attack.t1548.002
  - attack.privilege-escalation
