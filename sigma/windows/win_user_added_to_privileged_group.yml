title: User Added to Privileged Group
id: e672b989-776b-42f4-a5fb-7b49d9d73327
status: experimental
description: |
  Detects indicators of User Added to Privileged Group (T1098.007).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1098/007/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID:
      - 4728
      - 4732
      - 4756
    TargetGroupName|contains:
      - 'Admin'
      - 'Domain Admins'
      - 'Enterprise Admins'
      - 'Schema Admins'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Authorized admin provisioning.
  - Employee onboarding to admin team.
level: high
tags:
  - attack.t1098.007
  - attack.persistence
