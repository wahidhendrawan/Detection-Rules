title: Windows Service with Suspicious Binary Path
id: 95ca6681-ed8e-40f4-8219-898d719c0a2f
status: experimental
description: |
  Detects indicators of Windows Service with Suspicious Binary Path (T1543.003).
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1543/003/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\\sc.exe'
    CommandLine|contains:
      - 'create'
    CommandLine|contains:
      - '\\Temp\\'
      - '\\AppData\\'
      - 'cmd.exe'
      - 'powershell'
  condition: selection
fields:
  - Image
  - CommandLine
  - User
falsepositives:
  - Extremely rare - services should not point to Temp.
level: high
tags:
  - attack.t1543.003
  - attack.persistence
