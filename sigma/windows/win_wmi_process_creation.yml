title: Process Creation via WMI (WmiPrvSE)
id: 8c3f1a27-d4b6-4e5a-9c82-7f6d3b1e0a54
status: experimental
description: |
  Detects processes spawned by WmiPrvSE.exe which indicates remote or
  local WMI command execution - commonly used for lateral movement.
author: Wahid Hendrawan
date: 2026/06/04
references:
  - https://attack.mitre.org/techniques/T1047/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith: '\WmiPrvSE.exe'
  filter_system:
    Image|endswith:
      - '\WmiPrvSE.exe'
      - '\WmiApSrv.exe'
      - '\scrcons.exe'
  condition: selection and not filter_system
fields:
  - Image
  - CommandLine
  - User
  - ParentCommandLine
falsepositives:
  - SCCM / monitoring tools yang pakai WMI untuk inventory.
  - Admin script yang sah menggunakan WMI.
level: medium
tags:
  - attack.t1047
  - attack.execution
